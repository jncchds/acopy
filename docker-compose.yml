# Local build of ACopy from source. For a deployment, use the published image instead (see README).
services:
  acopy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acopy
    ports:
      - "5005:8080"
    environment:
      TZ: Europe/Berlin
      # ACOPY_Auth__Password: change-me   # otherwise chosen on first visit
      # PUID: "1000"
      # PGID: "1000"
      # With the telegram-bot-api service below: every Telegram URL left blank in the UI uses it
      # ACOPY_Telegram__ApiUrl: http://telegram-bot-api:8081
    volumes:
      - ./data:/data
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Optional self-hosted Telegram Bot API server: files up to 2 GB per message instead of 50 MB.
  #   1. Get an api_id and api_hash at https://my.telegram.org → "API development tools"
  #      and put them in .env next to this file (TELEGRAM_API_ID=…, TELEGRAM_API_HASH=…)
  #   2. Uncomment ACOPY_Telegram__ApiUrl above, then: docker compose --profile telegram up -d --build
  #   3. In ACopy → Destinations → your Telegram destination: "Log out from public API" (once per bot)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2
    profiles: [telegram]
    container_name: telegram-bot-api
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"   # --local: 2 GB uploads, unlimited downloads
    volumes:
      - ./telegram-bot-api:/var/lib/telegram-bot-api
    # No published port: only ACopy talks to it, over the compose network (plain HTTP, token in the URL)
    restart: unless-stopped
