# Local build of ACopy from source. For a deployment, use the published image instead (see README).
services:
  acopy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acopy
    ports:
      - "5005:8080"
    environment:
      TZ: Europe/Berlin
      # ACOPY_Auth__Password: change-me   # otherwise chosen on first visit
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
