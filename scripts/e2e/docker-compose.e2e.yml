# End-to-end stack: ACopy plus one container per engine (configured through labels), an S3 server
# destination and a mock Telegram Bot API.
#   docker compose -f scripts/e2e/docker-compose.e2e.yml up -d --build
#   node scripts/e2e/e2e.mjs
# UI on http://localhost:5006 (password: e2e-password)
name: acopy-e2e

services:
  acopy:
    build: { context: ../.., dockerfile: Dockerfile }
    ports: ["5006:8080"]
    environment:
      ACOPY_Auth__Password: e2e-password
      ACOPY_Docker__ScanSeconds: "10"
      # Default Bot API server for every Telegram URL left blank (the way a self-hosted server is wired in)
      ACOPY_Telegram__ApiUrl: http://mock-telegram:8081
      # … and files go to it through a shared upload folder, seen under a different path on each side
      ACOPY_Telegram__UploadDir: /telegram-uploads
      ACOPY_Telegram__ServerUploadDir: /var/lib/telegram-bot-api/acopy-uploads
      TZ: Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acopy-data:/data
      - acopy-backups:/backups
      - sqlite-data:/sqlite
      - tg-uploads:/telegram-uploads

  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: pg-secret, POSTGRES_DB: appdb }
    labels:
      acopy.enable: "true"
      # Two targets from one container: the app database (encrypted, copied off-site) and the whole cluster
      acopy.jobs.app.database: "appdb"
      acopy.jobs.app.encryption: "e2e-pass"
      acopy.jobs.app.destinations: "s3,tg"
      acopy.jobs.all.schedule: "*/2 * * * *"
      acopy.jobs.all.keep: "3"
      acopy.jobs.all.naming: "rolling"
      # The cluster dump goes to two people instead of the destination's chat
      acopy.jobs.all.destinations: "tg,s3-dated"
      acopy.jobs.all.telegram_chats: "100, 200"

  mariadb:
    image: mariadb:11
    # Disabled event scheduler: MariaDB refuses SHOW EVENTS (1577), so ACopy must dump again without --events
    command: ["--event-scheduler=DISABLED"]
    environment: { MARIADB_ROOT_PASSWORD: maria-secret, MARIADB_DATABASE: shop }
    labels:
      acopy.enable: "true"
      acopy.database: "shop"
      acopy.keep: "0"
      acopy.max_age_days: "30"
      acopy.encryption: "e2e-age"
      acopy.destinations: "s3,tg-http"

  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: mysql-secret, MYSQL_DATABASE: blog }
    labels:
      acopy.enable: "true"
      acopy.name: "mysql-net"
      acopy.mode: "network"
      acopy.user: "root"
      acopy.password: "mysql-secret"
      acopy.database: "blog"

  mongo:
    image: mongo:7   # mongo 8 refuses to start on Linux 6.19+ (SERVER-121912)
    environment: { MONGO_INITDB_ROOT_USERNAME: root, MONGO_INITDB_ROOT_PASSWORD: mongo-secret }
    labels:
      acopy.enable: "true"
      acopy.compression: "none"

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      acopy.enable: "true"

  # Creates a small SQLite file in a shared volume for the network-mode SQLite test
  sqlite-seed:
    image: alpine:3.22
    command: sh -c "apk add --no-cache sqlite >/dev/null && sqlite3 /sqlite/app.db 'create table if not exists t(x); delete from t; insert into t values (1),(2),(3);' && sleep infinity"
    volumes: ["sqlite-data:/sqlite"]

  # S3 destination: rclone serving a directory over the S3 API
  s3:
    image: rclone/rclone:latest
    command: serve s3 /data --auth-key e2ekey,e2esecret --addr :9000

  mock-telegram:
    image: node:22-alpine
    command: node /mock/mock-telegram.mjs
    ports: ["5081:8081"]
    volumes:
      - ./mock-telegram.mjs:/mock/mock-telegram.mjs:ro
      - tg-uploads:/var/lib/telegram-bot-api/acopy-uploads:ro
    networks:
      default:
        # A second name for the same mock: destinations using it are not "the" self-hosted server → HTTP uploads
        aliases: [telegram-http]

  # Not labelled, on a network ACopy is not on, no published port: the network-mode picker must say "unreachable"
  island:
    image: valkey/valkey:8-alpine
    networks: [island]

networks:
  island:

volumes:
  tg-uploads:
  acopy-data:
  acopy-backups:
  sqlite-data:
